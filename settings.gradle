pluginManagement {
    repositories {
        google {
            content {
                includeGroupAndSubgroups("androidx")
                includeGroupAndSubgroups("com.android")
                includeGroupAndSubgroups("com.google")
            }
        }
        mavenCentral()
        mavenLocal()
    }
    plugins {
        def agp = "9.5.0"
        id("com.android.application") version agp
        id("com.android.library") version agp
        id("com.android.settings") version agp
        id("dev.rikka.tools.refine") version "4.4.0"
    }
}
plugins {
    id("com.android.settings")
}
android {
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }
    minSdk {
        version = release(21)
    }
    targetSdk {
        version = release(37)
    }
    buildToolsVersion = "37.0.0"
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google {
            content {
                includeGroupAndSubgroups("androidx")
                includeGroupAndSubgroups("com.android")
                includeGroupAndSubgroups("com.google")
            }
        }
        mavenCentral()
        mavenLocal()
    }
    versionCatalogs {
        libs {
            version('refine', '4.4.0')
            library('refine-runtime', 'dev.rikka.tools.refine', 'runtime').versionRef('refine')
            library('refine-annotation', 'dev.rikka.tools.refine', 'annotation').versionRef('refine')
            library('refine-annotation-processor', 'dev.rikka.tools.refine', 'annotation-processor').versionRef('refine')
        }
    }
}
include ':stub'
include ':compat'
